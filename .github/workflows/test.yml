name: "Build and test"

on:
  push:
    branches: [ "main", "dev", "dev-clean" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main", "dev", "dev-clean" ]
  schedule:
    - cron: '23 5 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-unit-tests:
    name: Host C unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Build and run host C unit tests
      run: ./workflows/autobuild.sh local

  firmware-build:
    name: RP2350 firmware build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Build RP2350 firmware
      env:
        PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
      run: |
        ./workflows/autobuild.sh pico
        ./build_pico_fido.sh
        test -s release/pico_fido_waveshare_rp2350_one-*.uf2
        test -s release/pico_fido_pico2-*.uf2
