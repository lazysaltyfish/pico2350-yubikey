name: "Nightly deploy"

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    name: Deploy nightly
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_PATH: ${{ runner.temp }}/private.pem
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore private key
        env:
          PRIVATE_KEY_B64: ${{ secrets.PRIVATE_KEY_B64 }}
        run: |
          if [ -n "${PRIVATE_KEY_B64}" ]; then
            echo "${PRIVATE_KEY_B64}" | base64 -d > "${SIGNING_KEY_PATH}"
            chmod 600 "${SIGNING_KEY_PATH}"
          else
            echo "PRIVATE_KEY_B64 not set; building unsigned RP2350 UF2 images."
          fi
      - name: Build RP2350 firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          SECURE_BOOT_PKEY: ${{ runner.temp }}/private.pem
        run: |
          ./workflows/autobuild.sh pico
          ./build_pico_fido.sh
      - name: Delete private key
        if: always()
        run: rm -f "${SIGNING_KEY_PATH}"
      - name: Update nightly release
        uses: pyTooling/Actions/releaser@v6.7.0
        with:
          tag: nightly-${{ github.ref_name }}
          rm: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: release/*.*
